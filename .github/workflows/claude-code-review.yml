name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューしてください。対象はTypeScript/ReactのRaycast拡張です。

            観点:
            - 正しさ（バグ、エッジケース、エラーハンドリング）
            - セキュリティ（外部コマンド実行時の引数の扱いなど）
            - 可読性・保守性
            - テストの過不足

            ルール:
            - コメントは日本語で書く
            - 具体的な問題はインラインコメントで指摘する
            - 全体所感は1件のトップレベルコメントにまとめる
            - 確信の低い指摘やスタイルだけの指摘は控える

            トップレベルコメントの1行目には、次のいずれか1つを判定として書く:
            - `判定: ✅ マージ可` … ブロッキングな問題なし
            - `判定: ⚠️ 要確認` … 人が判断すべき懸念あり（理由を列挙）
            - `判定: ❌ 要修正` … マージ前に直すべき問題あり（該当箇所を列挙）
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
