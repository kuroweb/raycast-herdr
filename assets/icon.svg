<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#232C52"/><stop offset="0.5" stop-color="#141A33"/><stop offset="1" stop-color="#080B18"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA6FF"/><stop offset="1" stop-color="#5A6FF0"/>
    </linearGradient>
    <linearGradient id="second" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4A6FF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glowB" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#5A6FF0" flood-opacity="0.60"/>
    </filter>
    <filter id="glowP" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.50"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- 稼働中のagentのpane -->
  <rect x="96" y="96" width="186" height="186" rx="34" fill="url(#active)" filter="url(#glowB)"/>
  <!-- 待機中のpane -->
  <rect x="306" y="96" width="110" height="110" rx="26" fill="#FFFFFF" fill-opacity="0.14"/>
  <!-- 別のagentのpane -->
  <rect x="306" y="230" width="110" height="186" rx="26" fill="url(#second)" filter="url(#glowP)"/>
  <!-- 待機中のpane -->
  <rect x="96" y="306" width="186" height="110" rx="26" fill="#FFFFFF" fill-opacity="0.09"/>
</svg>
